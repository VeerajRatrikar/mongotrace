services:
  - type: web
    name: mongotrace
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DB_NAME
        value: mongotrace
      - key: FRONTEND_URL
        value: https://mongotrace.onrender.com
      - key: MONGODB_URI
        sync: false
